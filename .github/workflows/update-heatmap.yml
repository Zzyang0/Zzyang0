name: Refresh contribution heatmap

on:
  schedule:
    - cron: "17 20 * * *"   # every day at 20:17 UTC (04:17 in China)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild assets/heatmap.svg
        shell: pwsh
        run: ./tools/update-heatmap.ps1

      - name: Commit if the image changed
        run: |
          if git diff --quiet -- assets/heatmap.svg; then
            echo "heatmap unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/heatmap.svg
            git commit -m "chore: refresh contribution heatmap"
            git push
          fi
